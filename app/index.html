<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PolyBoquette - Marchés Prédictifs Gadz'arts</title>
    
    <!-- PWA Manifest & Meta -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#800000">
    <link rel="icon" type="image/png" href="logo.png">
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./css/style.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <a href="#/" class="brand">
            <img src="logo.png" alt="Logo PB">
            PolyBoquette
        </a>
        
        <div class="nav-actions">
            <button class="btn-icon" id="themeToggle" title="Changer le thème">
                <i class="fa-solid fa-moon"></i>
            </button>
            
            <div class="user-pill hidden" id="userPill">
                <i class="fa-solid fa-circle-user" style="color: var(--accent-color)"></i>
                <span id="userName">Invité</span>
                <span class="points" id="userPoints">
                     <i class="fa-solid fa-coins"></i> 0
                </span>
            </div>
            
            <div id="authActions">
                <a href="#/login" class="btn-outline">Connexion</a>
                <a href="#/register" class="btn-primary">S'inscrire</a>
            </div>

            <button class="btn-outline hidden" id="logoutBtn" title="Se déconnecter">
                <i class="fa-solid fa-right-from-bracket"></i>
            </button>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container" id="app-container">
        <!-- Vues gérées par le Routeur JS -->
    </main>

    <!-- Global UI Layers -->
    <div id="toast-container" class="toast-container"></div>
    <div id="modal-container"></div>
    <div id="betSlipContainer" class="bet-slip-container"></div>

    <!-- Application Script ES6 Modules -->
    <script type="module" src="./js/main.js"></script>
</body>
</html>
